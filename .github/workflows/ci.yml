name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test agent/ScreenTime.Agent.Tests/ScreenTime.Agent.Tests.csproj
      - run: dotnet test agent/ScreenTime.Control.Tests/ScreenTime.Control.Tests.csproj
      - run: dotnet build agent/ScreenTime.Agent/ScreenTime.Agent.csproj -c Release
      - run: dotnet build agent/ScreenTime.Service/ScreenTime.Service.csproj -c Release
      - name: Validate control installer syntax
        shell: pwsh
        run: |
          $scripts = 'install-control', 'recover-control', 'uninstall-control', 'package-control', 'test-control-install'
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/agent/$script.ps1", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Build complete control package
        shell: pwsh
        run: .\agent\package-control.ps1
